[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pullpilot"
version = "1.0.0"
description = "PullPilot backend service"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.3.1",
  "uvicorn==0.52.0",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.51",
  "apscheduler==3.11.3",
  "python-multipart==0.0.32",
  "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1",
  # Starlette >=1.3 deprecates `httpx` in `starlette.testclient` in favour of `httpx2`.
  "httpx2>=2.9.1",
  "ruff>=0.16.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.ruff]
target-version = "py311"
src = ["server", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
  "E501",
  "I001",
  "UP006",
  "UP022",
  "UP035",
  "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
