[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pullpilot"
version = "1.0.0"
description = "PullPilot backend service"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  # Pinned on its own because server/app.py imports starlette.middleware.sessions
  # directly. FastAPI declares its own compatible range, so bump the two together —
  # two independent Dependabot PRs can otherwise land an unresolvable pair.
  "starlette==1.3.1",
  "uvicorn==0.52.1",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.51",
  "apscheduler==3.11.3",
  "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1",
  # Starlette >=1.3 deprecates `httpx` in `starlette.testclient` in favour of `httpx2`.
  "httpx2>=2.9.1",
  # Pinned exactly, unlike the other two: there is no Python lockfile, so a `>=` here
  # means CI installs whatever ruff shipped that morning and a release that adds a rule
  # turns an unrelated commit red — and does not reproduce in an older local venv.
  "ruff==0.16.1",
  # AGENTS.md tells you to run `.venv/bin/pip-audit` before calling a dependency change
  # good, but it was never installed by `make setup`: only security-audit.yml pip-installed
  # it, on the runner. Pinned for the same reason as ruff.
  "pip-audit==2.10.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

# The built SPA, which the Docker build drops into server/static before `pip install`.
# Declared explicitly because `include-package-data` alone relies on MANIFEST.in or a
# revision-control plugin, and neither exists inside the image build.
[tool.setuptools.package-data]
server = ["static/**/*"]

[tool.ruff]
target-version = "py311"
src = ["server", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
  "E501",
  "UP006",
  "UP022",
  "UP035",
  "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
