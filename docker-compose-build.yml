# PullPilot — local build (no GHCR).
#
# Quick start: mkdir -p /srv/docker-stacks, then:
#   docker compose -f docker-compose-build.yml up -d --build
#
# Same variables as docker-compose.yml, all optional.
#
services:
  pullpilot:
    container_name: pullpilot
    build:
      context: .
      dockerfile: Dockerfile
    image: pullpilot:local
    restart: unless-stopped
    ports:
      - "${PULLPILOT_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pullpilot_data:/app/data
      - ${STACKS_PATH:-${DOCKER_ROOT_PATH:-/srv/docker-stacks}}:${STACKS_PATH:-${DOCKER_ROOT_PATH:-/srv/docker-stacks}}
    environment:
      TZ: ${TZ:-UTC}
      STACKS_PATH: ${STACKS_PATH:-${DOCKER_ROOT_PATH:-/srv/docker-stacks}}
      PUBLIC_URL: ${PUBLIC_URL:-}

volumes:
  pullpilot_data:
