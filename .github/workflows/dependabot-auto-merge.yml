# Auto-merge for Dependabot's low-risk updates (patch and minor).
#
# ─── TWO REPOSITORY SETTINGS ARE REQUIRED TO ACTIVATE THIS ──────────────────────
#   1. Settings → General → Pull Requests → "Allow auto-merge".
#   2. Settings → Rules → a ruleset on `main` with "Require status checks to pass"
#      requiring the CI checks: "Python 3.11", "Python 3.12", "Python 3.13",
#      "Frontend" and "Docker image".
#
# Without (1) auto-merge does not exist, and without (2) it would merge without waiting
# for CI. While "Allow auto-merge" is off this workflow does nothing and finishes green:
# it checks the setting before attempting anything.
#
# Security: it uses `pull_request_target`, which runs with write permissions on the base
# repository. That is why it NEVER checks out or executes PR code — it only reads
# metadata and calls the API. Do not add build or test steps here.
name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check whether auto-merge is enabled on the repository
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.allow_auto_merge')
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo "Auto-merge is disabled on this repository; doing nothing." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "Enable it under Settings → General → Pull Requests → Allow auto-merge." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch Dependabot metadata
        id: meta
        if: steps.gate.outputs.enabled == 'true'
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Majors are reviewed by hand. Everything else (patch/minor, including grouped
      # security updates) goes in only if CI passes.
      - name: Enable auto-merge (patch and minor)
        if: >-
          steps.gate.outputs.enabled == 'true' &&
          steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Flag majors for manual review
        if: >-
          steps.gate.outputs.enabled == 'true' &&
          steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Major update: manual review required." >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_URL" --body \
            "**Major** update: auto-merge does not apply. This needs manual review."
