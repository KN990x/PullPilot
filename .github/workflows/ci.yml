# Gate de merge del repositorio: replica `make lint` + `make test` y valida la imagen.
# Es el check que faltaba; sin él ningún PR de Dependabot tenía señal para mergearse.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check server tests

      - name: Byte-compile
        run: python -m compileall -q server

      - name: Tests
        run: python -m pytest tests/ -q

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Una sola plataforma: aquí sólo se comprueba que el multi-stage compila.
      # El build multi-arch real vive en ghcr-publish.yml.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: pullpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (arranque + healthcheck)
        run: |
          docker run -d --name pullpilot-ci \
            -e ALLOW_NO_AUTH=true \
            -e SESSION_SECRET=ci-only-not-a-real-secret \
            -p 8000:8000 \
            pullpilot:ci
          for _ in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/update-status || true)
            if [ "$status" = "200" ] || [ "$status" = "401" ]; then
              echo "El contenedor responde (HTTP $status)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::El contenedor no respondió en 60s"
          docker logs pullpilot-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f pullpilot-ci || true
