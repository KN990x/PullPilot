# The repository's only merge gate: one job, one check. Mirrors `make lint` + `make test`,
# which is what actually runs before committing (see AGENTS.md), and adds the one thing a
# development machine may lack: a Docker build and a cold-start smoke test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never on a push. This repo commits straight to main with no PRs, so this is the only
  # run a commit ever gets: cancelling it because a second commit arrived meant the first
  # one was never validated at all. Superseded PR runs are still fair game to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pinned: the validator used to be fetched from actionlint's `main` branch and pip's latest,
# so the gate could change under a commit that changed nothing.
env:
  ACTIONLINT_VERSION: "1.7.12"
  CHECK_JSONSCHEMA_VERSION: "0.38.0"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    # A hung Docker build would otherwise burn the 6h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one file whose breakage is silent: an invalid dependabot.yml disables
      # Dependabot entirely, with no error anywhere. Nothing checked it before.
      - name: Validate workflows and Dependabot config
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color .github/workflows/*.yml
          rm -f ./actionlint
          python -m pip install --quiet "check-jsonschema==${CHECK_JSONSCHEMA_VERSION}"
          check-jsonschema --schemafile https://json.schemastore.org/dependabot-2.0.json \
            .github/dependabot.yml

      # 3.11 only: what .python-version pins and what the image ships.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check server tests

      - name: Byte-compile
        run: python -m compileall -q server

      - name: Tests
        run: python -m pytest tests/ -q

      # No `version:`: the action reads `packageManager` from web/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: web
        run: pnpm run lint

      - name: Test frontend
        working-directory: web
        run: pnpm run test

      - name: Build frontend
        working-directory: web
        run: pnpm run build

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Single platform: only checks the build compiles. Multi-arch is in ghcr-publish.yml.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: pullpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (cold start + setup wizard)
        run: |
          # No auth variables at all: exactly the cold start a new user gets.
          docker run -d --name pullpilot-ci -p 8000:8000 pullpilot:ci

          for _ in $(seq 1 30); do
            if curl -fsS -o /tmp/status.json http://127.0.0.1:8000/api/auth/status; then
              break
            fi
            sleep 2
          done
          if ! [ -s /tmp/status.json ]; then
            echo "::error::Container did not respond within 60s"
            docker logs pullpilot-ci
            exit 1
          fi
          echo "auth status: $(cat /tmp/status.json)"
          grep -q '"setup_complete":false' /tmp/status.json

          # The API stays closed until the wizard is done.
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/projects)
          [ "$code" = "401" ] || { echo "::error::/api/projects should be 401, got $code"; exit 1; }

          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H 'Content-Type: application/json' \
            -d '{"username":"ciadmin","password":"ci-only-password","password_confirm":"ci-only-password"}' \
            -c /tmp/cookies.txt http://127.0.0.1:8000/api/auth/setup)
          [ "$code" = "201" ] || { echo "::error::setup should be 201, got $code"; docker logs pullpilot-ci; exit 1; }

          code=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt http://127.0.0.1:8000/api/projects)
          [ "$code" = "200" ] || { echo "::error::/api/projects with session should be 200, got $code"; exit 1; }

          # The SPA fallback must not swallow API 404s: it used to return index.html with
          # status 200 and the UI took the delete as done.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -b /tmp/cookies.txt http://127.0.0.1:8000/api/schedules/99999)
          [ "$code" = "404" ] || { echo "::error::/api/schedules/99999 should be 404, got $code"; exit 1; }

          # ...but a navigation route does have to get the SPA shell.
          code=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt http://127.0.0.1:8000/history)
          [ "$code" = "200" ] || { echo "::error::/history should serve the SPA shell, got $code"; exit 1; }

          # docker compose has to exist in the image: it runs every update, and now comes
          # from the official CLI rather than the docker.io package.
          docker exec pullpilot-ci docker compose version

          echo "Cold start, setup wizard, authenticated request and 404 handling all OK"

      - name: Cleanup
        if: always()
        run: docker rm -f pullpilot-ci || true
