# The repository's merge gate: mirrors `make lint` + `make test` and validates the image.
# This is the check that was missing; without it no Dependabot PR had any signal to be
# merged on.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The matrix covers 3.11-3.13 on purpose; .python-version pins 3.11 for local
      # development (parity with the python:3.11-slim image).
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check server tests

      - name: Byte-compile
        run: python -m compileall -q server

      - name: Tests
        run: python -m pytest tests/ -q

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No `version:`: pnpm/action-setup reads `packageManager` from web/package.json,
      # so CI, Docker and local development all use exactly the same pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm run lint

      - name: Build
        working-directory: web
        run: pnpm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Single platform: this only checks that the multi-stage build compiles.
      # The real multi-arch build lives in ghcr-publish.yml.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: pullpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (startup + healthcheck)
        run: |
          docker run -d --name pullpilot-ci \
            -e ALLOW_NO_AUTH=true \
            -e SESSION_SECRET=ci-only-not-a-real-secret \
            -p 8000:8000 \
            pullpilot:ci
          for _ in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/update-status || true)
            if [ "$status" = "200" ] || [ "$status" = "401" ]; then
              echo "Container is responding (HTTP $status)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container did not respond within 60s"
          docker logs pullpilot-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f pullpilot-ci || true
