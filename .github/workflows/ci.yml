# The repository's only merge gate: one job, one check. Mirrors `make lint` + `make test`,
# which is what actually runs before committing (see AGENTS.md), and adds the one thing a
# development machine may lack: a Docker build and a cold-start smoke test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never on a push. This repo commits straight to main with no PRs, so this is the only
  # run a commit ever gets: cancelling it because a second commit arrived meant the first
  # one was never validated at all. Superseded PR runs are still fair game to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    # A hung Docker build would otherwise burn the 6h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one file whose breakage is silent: an invalid dependabot.yml disables
      # Dependabot entirely, with no error anywhere. The check is shared by every KN990x
      # repository (KN990x/.github), pinned like any other action.
      - name: Validate workflows and Dependabot config
        uses: KN990x/.github/actions/validate-config@862ceef5b74c00a2debbb766b3aa4b3721af7e8c # v1.1.0

      # 3.11 only: what .python-version pins and what the image ships.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check server tests

      - name: Byte-compile
        run: python -m compileall -q server

      - name: Tests
        run: python -m pytest tests/ -q

      # No `version:`: the action reads `packageManager` from web/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: web
        run: pnpm run lint

      - name: Test frontend
        working-directory: web
        run: pnpm run test

      - name: Build frontend
        working-directory: web
        run: pnpm run build

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Single platform: only checks the build compiles. Multi-arch is in ghcr-publish.yml.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: pullpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Shared with the release workflow, which also boots the arm64 image with it. The
      # script removes its own container on exit.
      - name: Smoke test (cold start + setup wizard)
        run: bash .github/scripts/smoke-test.sh pullpilot:ci pullpilot-ci
