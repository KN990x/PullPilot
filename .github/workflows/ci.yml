# The repository's only merge gate: one job, one check.
#
# Design note: the real verification happens locally with `make lint` and `make test`
# before committing (see AGENTS.md). This workflow mirrors those two commands and adds
# the one thing a development machine may not have: a Docker build plus a cold-start
# smoke test. Splitting it into five jobs only produced five checks to read.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 3.11 and nothing else: it is what .python-version pins and what the
      # python:3.11-slim image ships. Testing versions the image never runs was noise.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The three steps below are exactly `make lint` (Python half) + `make test`.
      - name: Lint (ruff)
        run: ruff check server tests

      - name: Byte-compile
        run: python -m compileall -q server

      - name: Tests
        run: python -m pytest tests/ -q

      # No `version:`: pnpm/action-setup reads `packageManager` from web/package.json,
      # so CI, Docker and local development all use exactly the same pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: web
        run: pnpm run lint

      - name: Build frontend
        working-directory: web
        run: pnpm run build

      - uses: docker/setup-buildx-action@v4

      # Single platform: this only checks that the multi-stage build compiles.
      # The real multi-arch build lives in ghcr-publish.yml.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: pullpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (cold start + setup wizard)
        run: |
          # Sin ninguna variable de auth: exactamente el arranque en frío que se lleva
          # un usuario nuevo.
          docker run -d --name pullpilot-ci -p 8000:8000 pullpilot:ci

          for _ in $(seq 1 30); do
            if curl -fsS -o /tmp/status.json http://127.0.0.1:8000/api/auth/status; then
              break
            fi
            sleep 2
          done
          if ! [ -s /tmp/status.json ]; then
            echo "::error::Container did not respond within 60s"
            docker logs pullpilot-ci
            exit 1
          fi
          echo "auth status: $(cat /tmp/status.json)"
          grep -q '"setup_complete":false' /tmp/status.json

          # La API está cerrada hasta completar el asistente.
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/projects)
          [ "$code" = "401" ] || { echo "::error::/api/projects should be 401, got $code"; exit 1; }

          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H 'Content-Type: application/json' \
            -d '{"username":"ciadmin","password":"ci-only-password","password_confirm":"ci-only-password"}' \
            -c /tmp/cookies.txt http://127.0.0.1:8000/api/auth/setup)
          [ "$code" = "201" ] || { echo "::error::setup should be 201, got $code"; docker logs pullpilot-ci; exit 1; }

          code=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt http://127.0.0.1:8000/api/projects)
          [ "$code" = "200" ] || { echo "::error::/api/projects with session should be 200, got $code"; exit 1; }

          # El fallback de la SPA no debe tragarse los 404 de la API (regresión conocida:
          # devolvía index.html con status 200 y la UI daba el borrado por bueno).
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -b /tmp/cookies.txt http://127.0.0.1:8000/api/schedules/99999)
          [ "$code" = "404" ] || { echo "::error::/api/schedules/99999 should be 404, got $code"; exit 1; }

          # …pero una ruta de navegación sí tiene que recibir el shell de la SPA.
          code=$(curl -s -o /dev/null -w "%{http_code}" -b /tmp/cookies.txt http://127.0.0.1:8000/history)
          [ "$code" = "200" ] || { echo "::error::/history should serve the SPA shell, got $code"; exit 1; }

          # docker compose tiene que existir dentro de la imagen: es lo que ejecuta cada
          # actualización, y ahora viene del CLI oficial y no del paquete docker.io.
          docker exec pullpilot-ci docker compose version

          echo "Cold start, setup wizard, authenticated request and 404 handling all OK"

      - name: Cleanup
        if: always()
        run: docker rm -f pullpilot-ci || true
