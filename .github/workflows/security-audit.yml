# Dependency auditing. An alarm, not a merge gate — that is ci.yml. It never runs on
# `push` or `pull_request`: it used to, stayed red on main for weeks, and every Dependabot
# PR was born with a ✗ nobody could clear.
name: Security audit

on:
  schedule:
    # Mondays 05:30 UTC, before Dependabot opens the week's PRs.
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Python (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Capture dependency pins for audit
        run: python -m pip freeze | grep -v -E '^pullpilot(==| @)' > /tmp/audit-req.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit dependencies
        run: |
          {
            echo "### pip-audit"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # `|| status=$?` is required: with `-e`, a failing pip-audit would abort before
          # the markdown block is closed.
          set -o pipefail
          status=0
          pip-audit -r /tmp/audit-req.txt 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  npm-audit:
    name: Frontend (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Blocking: only what ends up in the bundle served to users.
      - name: Audit production dependencies
        working-directory: web
        run: |
          {
            echo "### pnpm audit — production dependencies (blocking)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          status=0
          pnpm audit --prod --audit-level high 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Informational: build tooling is never deployed, and over-broad advisory ranges
      # produce false positives here (e.g. GHSA-mh99-v99m-4gvg on brace-expansion).
      - name: Audit full tree (informational)
        working-directory: web
        continue-on-error: true
        run: |
          {
            echo "### pnpm audit — full tree, incl. devDependencies (informational)"
            echo '```'
            pnpm audit 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
