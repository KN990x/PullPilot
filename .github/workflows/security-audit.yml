# Dependency auditing. An alarm, not a merge gate — that is ci.yml. It never runs on
# `push` or `pull_request`: it used to, stayed red on main for weeks, and every Dependabot
# PR was born with a ✗ nobody could clear.
#
# Monthly, not weekly: Dependabot alerts already arrive the day an advisory is published,
# from the same database. This is the backstop, and a weekly one only repeated the same
# failure email every Monday until the fix landed.
name: Security audit

on:
  schedule:
    # The 1st of each month, 03:30 UTC: before Dependabot's monthly run (06:00 Madrid).
    - cron: "30 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Python (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Capture dependency pins for audit
        run: python -m pip freeze | grep -v -E '^pullpilot(==| @)' > /tmp/audit-req.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit dependencies
        run: |
          {
            echo "### pip-audit"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # `|| status=$?` is required: with `-e`, a failing pip-audit would abort before
          # the markdown block is closed.
          set -o pipefail
          status=0
          pip-audit -r /tmp/audit-req.txt 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  npm-audit:
    name: Frontend (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Blocking: only what ends up in the bundle served to users.
      - name: Audit production dependencies
        working-directory: web
        run: |
          {
            echo "### pnpm audit — production dependencies (blocking)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          status=0
          pnpm audit --prod --audit-level high 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Informational: build tooling is never deployed, and over-broad advisory ranges
      # produce false positives here (e.g. GHSA-mh99-v99m-4gvg on brace-expansion).
      - name: Audit full tree (informational)
        working-directory: web
        continue-on-error: true
        run: |
          {
            echo "### pnpm audit — full tree, incl. devDependencies (informational)"
            echo '```'
            pnpm audit 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Dependabot ignores majors on purpose; this keeps them visible in one issue that is
  # edited in place (no notification) instead of a PR per breaking release.
  majors:
    name: Pending majors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # The `==` pins live in pyproject.toml; pip compares what they installed against PyPI.
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Nothing is executed here, so no install scripts either.
      - name: Install frontend
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rewrite the "Pending major updates" issue
        uses: KN990x/.github/actions/majors-report@b2da4cea2a7c25bffb9f09520621be55ebd0c4a6 # v1.2.0
        with:
          pnpm-dirs: web
          pip-project: "."
