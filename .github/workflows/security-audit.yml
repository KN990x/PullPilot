# Dependency auditing.
#
# Design note: this workflow is an ALARM, not a merge gate — that is ci.yml, and it is
# the only check on a pull request. So this one never runs on `push` or `pull_request`:
# it used to, it stayed red on main for weeks, and every Dependabot PR was born with a ✗
# that nobody could clear. A weekly run plus a manual trigger gives the same signal
# without decorating every PR with it.
name: Security audit

on:
  schedule:
    # Mondays 05:30 UTC, before Dependabot opens the week's PRs.
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Capture dependency pins for audit
        run: python -m pip freeze | grep -v -E '^pullpilot(==| @)' > /tmp/audit-req.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit dependencies
        run: |
          {
            echo "### pip-audit"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # `|| status=$?` is required: the default shell runs with `-e`, so a failing
          # pip-audit would abort the script before the markdown block is closed.
          set -o pipefail
          status=0
          pip-audit -r /tmp/audit-req.txt 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  npm-audit:
    name: Frontend (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Blocking: only what ends up in the bundle served to users.
      - name: Audit production dependencies
        working-directory: web
        run: |
          {
            echo "### pnpm audit — production dependencies (blocking)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          status=0
          pnpm audit --prod --audit-level high 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Informational: build tooling (eslint, vite, workbox…) is never deployed.
      # Advisories with over-broad ranges also produce false positives here: for
      # example GHSA-mh99-v99m-4gvg declares `<= 5.0.7` for brace-expansion, which
      # sweeps in the 1.x and 2.x maintenance lines that are in fact patched.
      - name: Audit full tree (informational)
        working-directory: web
        continue-on-error: true
        run: |
          {
            echo "### pnpm audit — full tree, incl. devDependencies (informational)"
            echo '```'
            pnpm audit 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
