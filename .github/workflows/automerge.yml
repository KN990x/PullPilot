# Merges a Dependabot PR once it has a green CI run AND an approval from an authorised
# reviewer (AUTOMERGE_APPROVERS, the owner by default) on its current head. The fixed
# rules live in KN990x/.github (dependabot-merge.yml): no majors, dependency files only,
# nothing pushed on top — an approval never overrides them. CI runs again on main after every merge.
# Off switch for this repository: Actions variable DEPENDABOT_AUTOMERGE=off. For one PR:
# the `no-automerge` label. Who may approve: Actions variable AUTOMERGE_APPROVERS
# (space-separated logins; empty means the repository owner).
name: Dependabot automerge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["dependabot/**"]
  pull_request_review:
    types: [submitted]

permissions: {}

# CI finishing and the approval arriving can race; one decision per PR at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      ${{ vars.DEPENDABOT_AUTOMERGE != 'off' && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' &&
         startsWith(github.event.pull_request.head.ref, 'dependabot/'))) }}
    permissions:
      contents: write # merge
      pull-requests: write # merge and delete the branch
      actions: write # re-run CI on main after the merge
    uses: KN990x/.github/.github/workflows/dependabot-merge.yml@c859a5362f488cdc045747c8f44a03ad91aa6bd9 # v1.2.2
    with:
      approvers: ${{ vars.AUTOMERGE_APPROVERS }}
