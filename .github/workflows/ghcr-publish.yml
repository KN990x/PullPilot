# Release → GHCR. The pipeline itself lives in KN990x/.github (shared by every KN990x image):
# tag/version check, CI-passed check, amd64 + arm64 smoke tests with
# .github/scripts/smoke-test.sh, then the multi-arch push with provenance and SBOM, and the
# release assets.
name: Release → GHCR

on:
  release:
    types: [published]
  # Manual run of an existing tag. `push` off (the default) builds and smoke-tests only;
  # on, it republishes — e.g. after a transient Actions outage.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v2.0.0). Empty tests main.
        required: false
        type: string
        default: ""
      push:
        description: Publish the image and the release assets
        required: false
        type: boolean
        default: false
  # Monthly dry run of main (no push): a broken arm64 build shows up here, not on release day.
  schedule:
    - cron: "30 4 1 * *"

# No default permissions at workflow level; the called jobs ask only for what they need.
permissions: {}

# Never cancelled mid-flight: a half-pushed multi-arch manifest is worse than a duplicate
# run, so releases queue instead of superseding each other.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    permissions:
      contents: write # release assets (only the assets job gets it)
      packages: write # push to GHCR
      actions: read # check the released commit passed CI
    uses: KN990x/.github/.github/workflows/ghcr-publish.yml@b2da4cea2a7c25bffb9f09520621be55ebd0c4a6 # v1.2.0
    with:
      image: ghcr.io/kn990x/pullpilot
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      push: ${{ github.event_name == 'release' || inputs.push == true }}
      # No version check: pyproject.toml and web/package.json stay at 1.0.0 and do not
      # follow the release tags.
      release-assets: docker-compose.yml .env.example
