# Version updates are off: dependencies are updated by hand, with this repository's full
# check, and Dependabot security alerts stay on. This file stays only because the shared
# config check pinned in ci.yml (KN990x/.github v1.x) needs one; it goes when that pin moves.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
