# Group instead of piling up. `open-pull-requests-limit` applies ONLY to version updates:
# security updates are unlimited and open one PR per dependency unless a group with
# `applies-to: security-updates` exists. That is how 19 PRs once accumulated.
version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions-all:
        applies-to: version-updates
        patterns:
          - "*"

  # Python (pyproject.toml). No lockfile: CI audits the resolved tree instead.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    # Leaves room for a bad release to be yanked. Not applied to security updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
      python-patch-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"
      python-major:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "*"

  # Frontend (web/). The ecosystem is still called "npm" — it covers pnpm too, reading
  # web/pnpm-lock.yaml. Dependabot supports pnpm v7-v10, which is why `packageManager` is
  # pinned to 10.x: v11 would produce a lockfile it may not know how to update.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # `^` ranges: only touch package.json when the range no longer admits the version.
    # The default (`increase`) rewrites the manifest on every patch.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
    # Frozen on purpose: react 19 and tailwind 4 are migrations, not updates. Security
    # advisories ignore this list, so a CVE still opens a PR.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-patch-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"
      npm-major:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "*"

  # Dockerfile base images, so base-image CVEs do not go unnoticed.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
    # Same criterion: node 25 dropped corepack and odd majors are not LTS; python has to
    # stay in step with .python-version; docker is the CLI copied into the image.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
      - dependency-name: "docker"
        update-types: ["version-update:semver-major"]
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
      docker-all:
        applies-to: version-updates
        patterns:
          - "*"
