# Strategy: group instead of piling up.
#
# The problem this file solves: `open-pull-requests-limit` applies ONLY to version
# updates. Security updates are unlimited and, unless a group with
# `applies-to: security-updates` exists, Dependabot opens **one PR per dependency**.
# That is what led to 19 open PRs at once.
#
# Each ecosystem gets at most three groups:
#   *-security     -> every security alert in ONE PR (the urgent one)
#   *-patch-minor  -> patches and minors in ONE PR (near-blind merge once CI is green)
#   *-major        -> majors in ONE PR (manual review, but no drip)
version: 2

updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions-all:
        applies-to: version-updates
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Python (pyproject.toml). No lockfile: CI audits the resolved tree instead.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    # Avoids a drip of freshly published patches and leaves room for bad releases to
    # be yanked. Does not apply to security updates.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
      python-patch-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"
      python-major:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Frontend (web/). It uses pnpm: the ecosystem is still called "npm" because that
  # one covers npm, Yarn, pnpm and Bun; Dependabot reads web/pnpm-lock.yaml.
  #
  # NOTE: Dependabot supports pnpm v7-v10. That is why `packageManager` in
  # web/package.json is pinned to pnpm@10.34.5 rather than 11: v11 would produce a
  # lockfile Dependabot might not know how to update, and this whole file would stop
  # being of any use. The lockfile format (9.0) is the same in both, so nothing is
  # lost by waiting for v11 support.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # Dependencies use `^` ranges: only touch package.json when the range no longer
    # admits the new version. With the default strategy (`increase`) Dependabot
    # rewrites the manifest on every patch and produces redundant PRs.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
    # Frozen on purpose: upgrading these is a migration, not an update.
    #   react 19       -> API and rendering changes
    #   tailwindcss 4  -> CSS-first config (@tailwindcss/postcss, index.css)
    # Security advisories IGNORE this list, so if a CVE lands on any of them
    # Dependabot will open the PR anyway.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-patch-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"
      npm-major:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Dockerfile base images (node:24-alpine, python:3.11-slim).
  # These were not covered before: base-image CVEs went unnoticed.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
      docker-all:
        applies-to: version-updates
        patterns:
          - "*"
