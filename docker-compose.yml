services:
  pullpilot:
    container_name: pullpilot
    image: ghcr.io/kn990x/pullpilot:latest
    restart: unless-stopped
    ports:
      - "${PULLPILOT_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pullpilot_data:/app/data
      # Misma ruta en el host y dentro del contenedor: es lo que permite que los
      # `docker compose` que lanza PullPilot encuentren los stacks donde el host los tiene.
      # DOCKER_ROOT_PATH es el nombre antiguo y se sigue aceptando.
      - ${STACKS_PATH:-${DOCKER_ROOT_PATH:-/srv/docker-stacks}}:${STACKS_PATH:-${DOCKER_ROOT_PATH:-/srv/docker-stacks}}
    environment:
      TZ: ${TZ:-UTC}
      STACKS_PATH: ${STACKS_PATH:-${DOCKER_ROOT_PATH:-/srv/docker-stacks}}
      # Solo si hay un proxy inverso delante, p. ej. https://pullpilot.example.com
      PUBLIC_URL: ${PUBLIC_URL:-}

volumes:
  pullpilot_data:
